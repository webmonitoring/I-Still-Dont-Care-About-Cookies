name: publish_chromium_package

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Release mode for workflow_dispatch runs
        type: choice
        options:
          - upstream
          - patch
        default: upstream
        required: true
  pull_request:
    types:
      - closed
    branches:
      - wm/patches

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'wm/patches' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/
          scope: "@webmonitoring"

      - name: Detect PR scope
        if: github.event_name == 'pull_request'
        id: prscope
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });

            const fileNames = files.map((f) => f.filename);
            const onlyRules =
              fileNames.length > 0 &&
              fileNames.every((name) => name === "src/data/rules.js");

            core.setOutput("only_rules", String(onlyRules));
            core.setOutput("files_csv", fileNames.join(","));
            core.info(`PR #${prNumber} changed files: ${fileNames.join(", ")}`);
            core.info(`PR #${prNumber} only rules.js: ${onlyRules}`);

      - name: Determine release mode
        id: release
        env:
          RELEASE_MODE_INPUT: ${{ github.event.inputs.release_mode || 'upstream' }}
          PR_ONLY_RULES: ${{ steps.prscope.outputs.only_rules || 'false' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ "$PR_ONLY_RULES" = "true" ]; then
              MODE="patch"
            else
              MODE="upstream"
            fi
          else
            MODE="$RELEASE_MODE_INPUT"
          fi
          if [ "$MODE" != "upstream" ] && [ "$MODE" != "patch" ]; then
            echo "Invalid release mode: $MODE"
            exit 1
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Release mode: $MODE"

      - name: Resolve upstream release tag
        id: upstream
        run: |
          git remote add upstream https://github.com/OhMyGuus/I-Still-Dont-Care-About-Cookies.git 2>/dev/null || true
          git fetch upstream master --tags --prune

          UPSTREAM_TAG="$(
            git for-each-ref \
              --merged=upstream/master \
              --sort=-version:refname \
              --format='%(refname:lstrip=2)' \
              refs/tags \
            | grep -E '^[vV][0-9]+\.[0-9]+\.[0-9]+([-.].*)?$' \
            | head -n1
          )"
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "Could not resolve a release-style tag from upstream/master."
            exit 1
          fi
          UPSTREAM_VERSION="${UPSTREAM_TAG#[vV]}"
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream: $UPSTREAM_TAG"

      - name: Sync package version from src manifest
        run: node webmonitoring/scripts/sync-chromium-package-version.mjs

      - name: Set next patch package version
        if: steps.release.outputs.mode == 'patch'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -e "const p=require('./src/package.json'); process.stdout.write(p.name)")
          BASE_VERSION="${{ steps.upstream.outputs.upstream_version }}"
          npm view "$PACKAGE_NAME" versions --json --registry=https://npm.pkg.github.com/ > /tmp/published_versions.json 2>/dev/null || echo "[]" > /tmp/published_versions.json

          NEXT_PATCH=$(node - "$BASE_VERSION" /tmp/published_versions.json <<'NODE'
          const fs = require('fs');
          const base = process.argv[2];
          const versionsPath = process.argv[3];
          const escapeRegExp = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          let data = [];
          try {
            data = JSON.parse(fs.readFileSync(versionsPath, 'utf8'));
          } catch {
            data = [];
          }
          const versions = Array.isArray(data) ? data : (data ? [data] : []);
          const re = new RegExp(`^${escapeRegExp(base)}-wm\\.(\\d+)$`);
          let max = 0;
          for (const v of versions) {
            const m = re.exec(String(v));
            if (m) {
              max = Math.max(max, Number(m[1]));
            }
          }
          process.stdout.write(String(max + 1));
          NODE
          )

          NEW_VERSION="${BASE_VERSION}-wm.${NEXT_PATCH}"
          node -e "const fs=require('fs'); const p='src/package.json'; const pkg=JSON.parse(fs.readFileSync(p,'utf8')); pkg.version=process.argv[1]; fs.writeFileSync(p, JSON.stringify(pkg, null, 2)+'\n');" "$NEW_VERSION"
          echo "Set patch version: $NEW_VERSION"

      - name: Read package coordinates
        id: package
        run: |
          NAME=$(node -e "const p=require('./src/package.json'); process.stdout.write(p.name)")
          VERSION=$(node -e "const p=require('./src/package.json'); process.stdout.write(p.version)")
          echo "package_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved package: $NAME@$VERSION"

      - name: Validate package version policy
        env:
          RELEASE_MODE: ${{ steps.release.outputs.mode }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.upstream_version }}
          PKG_VERSION: ${{ steps.package.outputs.version }}
        run: |
          node <<'NODE'
          const mode = process.env.RELEASE_MODE;
          const upstreamTag = process.env.UPSTREAM_TAG;
          const upstreamVersion = process.env.UPSTREAM_VERSION;
          const pkgVersion = process.env.PKG_VERSION;

          const escapeRegExp = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

          if (mode === 'upstream') {
            if (pkgVersion !== upstreamTag && pkgVersion !== upstreamVersion) {
              throw new Error(`Package version (${pkgVersion}) does not match latest upstream tag (${upstreamTag}).`);
            }
            console.log(`Upstream release validated: ${pkgVersion} matches ${upstreamTag}`);
            process.exit(0);
          }

          if (mode === 'patch') {
            const re = new RegExp(`^${escapeRegExp(upstreamVersion)}-wm\\.\\d+$`);
            if (!re.test(pkgVersion)) {
              throw new Error(`Patch version (${pkgVersion}) must match ${upstreamVersion}-wm.<N>.`);
            }
            console.log(`Patch release validated: ${pkgVersion} (base ${upstreamVersion})`);
            process.exit(0);
          }

          throw new Error(`Unknown release mode: ${mode}`);
          NODE

      - name: Check if version already exists
        id: exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if npm view "${{ steps.package.outputs.package_name }}@${{ steps.package.outputs.version }}" version --registry=https://npm.pkg.github.com/ >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.exists.outputs.already_published != 'true'
        working-directory: src
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.release.outputs.mode }}" = "patch" ]; then
            npm publish --registry=https://npm.pkg.github.com/ --tag "wm-${{ steps.upstream.outputs.upstream_version }}"
          else
            npm publish --registry=https://npm.pkg.github.com/
          fi

      - name: Add or update base-version dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIST_TAG="wm-${{ steps.upstream.outputs.upstream_version }}"
          PACKAGE_VERSION="${{ steps.package.outputs.version }}"
          PACKAGE_NAME="${{ steps.package.outputs.package_name }}"
          npm dist-tag add "${PACKAGE_NAME}@${PACKAGE_VERSION}" "$DIST_TAG" --registry=https://npm.pkg.github.com/
          echo "Updated dist-tag: $DIST_TAG -> ${PACKAGE_NAME}@${PACKAGE_VERSION}"
